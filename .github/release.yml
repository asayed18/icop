# icop v0.1.3

## Highlights

- **Isolated Windows CUDA inference** — CUDA runs in `icop_cuda_host.exe`,
  keeping the NVIDIA provider out of VLC's process while preserving
  fail-closed blocking when the helper is unavailable.
- **Self-contained CUDA runtime** — The Windows package stages the matching
  CUDA 12 and cuDNN DLLs beside the helper and ONNX Runtime.
- **Reproducible CI release** — Tag and manual releases normalize their version
  and build the same Windows CUDA payload before creating the draft release.

