|---|---|---|
| Linux | x86_64 | `icop-0.1.1-linux-x86_64.tar.gz` |
| Linux | ARM64 | `icop-0.1.1-linux-arm64.tar.gz` |
| Windows | x86_64 | `icop-0.1.1-windows-x86_64.zip` |
