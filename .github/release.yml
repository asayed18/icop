## Installation

1. Extract the archive for your platform. Windows CUDA releases use split `.7z`
   volumes: download every volume, place them in one folder, then extract
   `.7z.001` with [7-Zip](https://www.7-zip.org/).
2. Copy the plugin and core shared library into your VLC `plugins/video_filter/`
   directory.
3. Launch VLC with `--video-filter=icop` (or enable it in Tools → Effects and
   Filters → Video Filters).

See the [README](https://github.com/asayed18/icop#readme) for detailed
instructions.

## Changelog (since v0.1.2)

- Moved Windows CUDA inference into an isolated helper process and blocks
  output fail-closed if it fails.
- Bundled matching CUDA 12 and cuDNN dependencies in the Windows CI package.
