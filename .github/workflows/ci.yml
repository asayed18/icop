name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build gcc g++ libva-dev
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: linux-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DNSFW_DOWNLOAD_MODELS=OFF
          -DNSFW_EXPORT_FALCONSAI_BASE_ONNX=OFF
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
      - name: Build
        run: cmake --build build-ci --target icop_plugin icop_core icop_test -j 2
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build gcc g++ libva-dev
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: linux-arm64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DNSFW_DOWNLOAD_MODELS=OFF
          -DNSFW_EXPORT_FALCONSAI_BASE_ONNX=OFF
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
      - name: Build
        run: cmake --build build-ci --target icop_plugin icop_core icop_test -j 2
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: windows-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
      - name: Configure
        shell: msys2 {0}
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DNSFW_DOWNLOAD_MODELS=OFF
          -DNSFW_EXPORT_FALCONSAI_BASE_ONNX=OFF
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
          -DNSFW_INSTALL_CUDA_RUNTIME=OFF
      - name: Build
        shell: msys2 {0}
        run: cmake --build build-ci --target icop_plugin icop_core icop_test -j 2
      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build-ci --output-on-failure

  macos-x86_64:
    name: macOS x86_64
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: brew install ninja
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: macos-x86_64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DNSFW_DOWNLOAD_MODELS=OFF
          -DNSFW_EXPORT_FALCONSAI_BASE_ONNX=OFF
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
      - name: Build
        run: cmake --build build-ci --target icop_plugin icop_core icop_test -j 2
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

  macos-arm64:
    name: macOS ARM64
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: brew install ninja
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: macos-arm64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DNSFW_DOWNLOAD_MODELS=OFF
          -DNSFW_EXPORT_FALCONSAI_BASE_ONNX=OFF
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
      - name: Build
        run: cmake --build build-ci --target icop_plugin icop_core icop_test -j 2
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
