name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build gcc g++

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: linux-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DNSFW_DOWNLOAD_MODELS=OFF
          -DNSFW_EXPORT_FALCONSAI_BASE_ONNX=OFF
          -DNSFW_BUILD_PLAYER_PROTOTYPE=OFF
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF

      - name: Build
        run: cmake --build build-ci --target nsfw_filter nsfw_filter_core nsfw_filter_core_test -j 2

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: windows-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: msys2 {0}
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DNSFW_DOWNLOAD_MODELS=OFF
          -DNSFW_EXPORT_FALCONSAI_BASE_ONNX=OFF
          -DNSFW_BUILD_PLAYER_PROTOTYPE=OFF
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
          -DNSFW_INSTALL_CUDA_RUNTIME=OFF

      - name: Build
        shell: msys2 {0}
        run: cmake --build build-ci --target nsfw_filter nsfw_filter_core nsfw_filter_core_test -j 2

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build-ci --output-on-failure
