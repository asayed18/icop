name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Normalize version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          version="${REQUESTED_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $REQUESTED_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  linux-x86_64:
    name: Linux x86_64
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ICOP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python for ONNX export
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Falconsai ONNX export dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          torch==2.6.0 torchvision==0.21.0 timm==1.0.15 transformers==4.48.1
          huggingface_hub==0.28.1 safetensors==0.5.2 onnx==1.17.0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build gcc g++ libva-dev wget git python3-pip
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: linux-x86_64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'tools/export_falconsai_base_onnx.py') }}
      - name: Download multi-EP ORT (CUDA + XNNPACK)
        continue-on-error: true
        run: |
          ORT_URL="https://github.com/asayed18/icop/releases/download/ort-multi-ep-v1.27.1/ort-multi-ep-linux-x64.tar.gz"
          mkdir -p /home/runner/ort-multi-ep
          wget -q "$ORT_URL" -O /tmp/ort-multi-ep.tar.gz
          tar xzf /tmp/ort-multi-ep.tar.gz -C /home/runner/ort-multi-ep --strip-components=1
          echo "Multi-EP ORT downloaded: $(ls /home/runner/ort-multi-ep/lib/*.so* | wc -l) libraries"
      - name: Configure
        run: |
          ORT_ROOT=""
          if [ -f /home/runner/ort-multi-ep/lib/libonnxruntime.so ]; then
            ORT_ROOT="-DONNXRUNTIME_ROOT=/home/runner/ort-multi-ep"
          fi
          cmake -S . -B build-ci -G Ninja \
            -DICOP_RELEASE_VERSION="${ICOP_VERSION#v}" \
            ${ORT_ROOT} \
            -DNSFW_DOWNLOAD_MODELS=ON \
            -DNSFW_GPU_RUNTIME=ON \
            -DNSFW_CUDA_VERSION=12 \
            -DNSFW_BUILD_BENCHMARKS=OFF \
            -DNSFW_BUILD_TESTS=OFF \
            -DNSFW_INSTALL_VLC_PLUGIN=OFF \
            -DNSFW_INSTALL_CUDA_RUNTIME=OFF
      - name: Package
        run: cmake --build build-ci --target icop_package -j $(nproc)
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: icop-linux-x86_64
          path: |
            releases/v*/icop-*.tar.gz
            releases/v*/icop-*.tar.gz.sha256
          if-no-files-found: error

  linux-arm64:
    name: Linux ARM64
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      ICOP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python for ONNX export
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Falconsai ONNX export dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          torch==2.6.0 torchvision==0.21.0 timm==1.0.15 transformers==4.48.1
          huggingface_hub==0.28.1 safetensors==0.5.2 onnx==1.17.0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build gcc g++ libva-dev
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: linux-arm64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'tools/export_falconsai_base_onnx.py') }}
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DICOP_RELEASE_VERSION="${ICOP_VERSION#v}"
          -DNSFW_DOWNLOAD_MODELS=ON
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_BUILD_TESTS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
      - name: Package
        run: cmake --build build-ci --target icop_package -j $(nproc)
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: icop-linux-arm64
          path: |
            releases/v*/icop-*.tar.gz
            releases/v*/icop-*.tar.gz.sha256
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ICOP_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Falconsai ONNX export dependencies
        shell: pwsh
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          torch==2.6.0 torchvision==0.21.0 timm==1.0.15 transformers==4.48.1
          huggingface_hub==0.28.1 safetensors==0.5.2 onnx==1.17.0
      - name: Install matching CUDA 12 and cuDNN runtime
        shell: pwsh
        run: |
          $cudaRuntime = Join-Path (Get-Location) '.ci-cuda-runtime'
          python -m pip install --disable-pip-version-check --no-cache-dir `
            --target $cudaRuntime `
            nvidia-cublas-cu12==12.9.2.10 `
            nvidia-cuda-nvrtc-cu12==12.9.86 `
            nvidia-cuda-runtime-cu12==12.9.79 `
            nvidia-cudnn-cu12==9.24.0.43 `
            nvidia-cufft-cu12==11.4.1.4 `
            nvidia-curand-cu12==10.3.10.19 `
            nvidia-cusolver-cu12==11.7.5.82 `
            nvidia-cusparse-cu12==12.5.10.65 `
            nvidia-nvjitlink-cu12==12.9.86 `
            nvidia-nvtx-cu12==12.9.79
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: windows-x86_64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'tools/export_falconsai_base_onnx.py') }}
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DICOP_RELEASE_VERSION="${ICOP_VERSION#v}"
          -DNSFW_DOWNLOAD_MODELS=ON
          -DNSFW_GPU_RUNTIME=ON
          -DNSFW_CUDA_VERSION=12
          -DNSFW_INSTALL_CUDA_RUNTIME=ON
          -DNSFW_CUDA_RUNTIME_DIR="$PWD/.ci-cuda-runtime"
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_BUILD_TESTS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
      - name: Package
        run: cmake --build build-ci --target icop_package -j $(nproc)
      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip --no-progress --yes
      - name: Create split Windows CUDA archive
        shell: pwsh
        run: |
          $versionRoot = Join-Path (Get-Location) "releases\v$env:ICOP_VERSION"
          $archiveName = "icop-v$env:ICOP_VERSION-windows-x86_64.7z"
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            throw "7-Zip was not installed at $sevenZip"
          }
          Push-Location $versionRoot
          try {
            & $sevenZip a -t7z -mx=7 -m0=lzma2 -md=512m -mmt=2 -v1900m $archiveName windows
            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }
          $parts = Get-ChildItem -LiteralPath $versionRoot -Filter "$archiveName.*" |
            Where-Object { $_.Name -match '\.7z\.\d{3}$' } |
            Sort-Object Name
          if ($parts.Count -eq 0) {
            throw "7-Zip did not create any archive volumes"
          }
          foreach ($part in $parts) {
            $hash = (Get-FileHash -LiteralPath $part.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "$($part.FullName).sha256" -Value "$hash  $($part.Name)"
          }
          Remove-Item -LiteralPath (Join-Path $versionRoot "icop-v$env:ICOP_VERSION-windows-x86_64.zip"), (Join-Path $versionRoot "icop-v$env:ICOP_VERSION-windows-x86_64.zip.sha256") -Force
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: icop-windows-x86_64
          path: |
            releases/v*/icop-*.7z.*
          if-no-files-found: error

  macos-x86_64:
    name: macOS x86_64
    needs: prepare
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      ICOP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python for ONNX export
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Falconsai ONNX export dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          torch==2.2.2 torchvision==0.17.2 timm==1.0.15 transformers==4.48.1
          huggingface_hub==0.28.1 safetensors==0.5.2 onnx==1.17.0
      - name: Install build tools
        run: |
          brew update
          brew install ninja
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: macos-x86_64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'tools/export_falconsai_base_onnx.py') }}
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DICOP_RELEASE_VERSION="${ICOP_VERSION#v}"
          -DNSFW_DOWNLOAD_MODELS=ON
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_BUILD_TESTS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
      - name: Package
        run: cmake --build build-ci --target icop_package -j $(sysctl -n hw.logicalcpu)
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: icop-macos-x86_64
          path: |
            releases/v*/icop-*.tar.gz
            releases/v*/icop-*.tar.gz.sha256
          if-no-files-found: error

  macos-arm64:
    name: macOS ARM64
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ICOP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python for ONNX export
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Falconsai ONNX export dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          torch==2.6.0 torchvision==0.21.0 timm==1.0.15 transformers==4.48.1
          huggingface_hub==0.28.1 safetensors==0.5.2 onnx==1.17.0
      - name: Install build tools
        run: |
          brew update
          brew install ninja
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: macos-arm64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'tools/export_falconsai_base_onnx.py') }}
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DICOP_RELEASE_VERSION="${ICOP_VERSION#v}"
          -DNSFW_DOWNLOAD_MODELS=ON
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_BUILD_TESTS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
      - name: Package
        run: cmake --build build-ci --target icop_package -j $(sysctl -n hw.logicalcpu)
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: icop-macos-arm64
          path: |
            releases/v*/icop-*.tar.gz
            releases/v*/icop-*.tar.gz.sha256
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs:
      - prepare
      - linux-x86_64
      - linux-arm64
      - windows-x86_64
      - macos-x86_64
      - macos-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: icop-*
          path: release-artifacts
          merge-multiple: false
      - name: List artifacts
        run: |
          find release-artifacts -type f | sort
      - name: Generate release notes
        id: release-notes
        run: |
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat .github/release.yml 2>/dev/null >> $GITHUB_OUTPUT || true
          echo "" >> $GITHUB_OUTPUT
          echo "## Downloads" >> $GITHUB_OUTPUT
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.7z.[0-9][0-9][0-9]" \) | sort | while read f; do
            name=$(basename "$f")
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            size_mb=$(echo "scale=1; $size / 1048576" | bc)
            echo "- \`$name\` (${size_mb} MB)" >> $GITHUB_OUTPUT
          done
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "icop ${{ needs.prepare.outputs.tag }}"
          body: ${{ steps.release-notes.outputs.release_notes }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/icop-*.tar.gz
            release-artifacts/**/icop-*.tar.gz.sha256
            release-artifacts/**/icop-*.7z.*
