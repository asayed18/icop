name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ICOP_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build gcc g++ libva-dev wget git python3-pip
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: linux-x86_64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
      - name: Restore multi-EP ORT cache
        id: cache-ort
        uses: actions/cache@v6
        with:
          path: /home/runner/ort-multi-ep
          key: linux-ort-multi-ep-${{ hashFiles('cmake/onnxruntime.cmake') }}
      - name: Build multi-EP ORT (CUDA + ROCm + XNNPACK)
        if: steps.cache-ort.outputs.cache-hit != 'true'
        timeout-minutes: 120
        run: |
          sudo bash tools/build_ort_multi_ep.sh \
            v1.27.1 /home/runner/ort-multi-ep
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DICOP_RELEASE_VERSION="${ICOP_VERSION#v}"
          -DONNXRUNTIME_ROOT=/home/runner/ort-multi-ep
          -DNSFW_DOWNLOAD_MODELS=ON
          -DNSFW_GPU_RUNTIME=ON
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_BUILD_TESTS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
          -DNSFW_INSTALL_CUDA_RUNTIME=OFF
      - name: Package
        run: cmake --build build-ci --target icop_package -j $(nproc)
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: icop-linux-x86_64
          path: |
            releases/v*/icop-*.tar.gz
            releases/v*/icop-*.tar.gz.sha256
          if-no-files-found: error

  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build gcc g++ libva-dev
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: linux-arm64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DICOP_RELEASE_VERSION="${ICOP_VERSION#v}"
          -DNSFW_DOWNLOAD_MODELS=ON
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_BUILD_TESTS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
      - name: Package
        run: cmake --build build-ci --target icop_package -j $(nproc)
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: icop-linux-arm64
          path: |
            releases/v*/icop-*.tar.gz
            releases/v*/icop-*.tar.gz.sha256
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: windows-x86_64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DICOP_RELEASE_VERSION="${ICOP_VERSION#v}"
          -DNSFW_DOWNLOAD_MODELS=ON
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_BUILD_TESTS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
      - name: Package
        run: cmake --build build-ci --target icop_package -j $(nproc)
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: icop-windows-x86_64
          path: |
            releases/v*/icop-*.zip
            releases/v*/icop-*.zip.sha256
          if-no-files-found: error

  macos-x86_64:
    name: macOS x86_64
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew update
          brew install ninja
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: macos-x86_64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DICOP_RELEASE_VERSION="${ICOP_VERSION#v}"
          -DNSFW_DOWNLOAD_MODELS=ON
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_BUILD_TESTS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
      - name: Package
        run: cmake --build build-ci --target icop_package -j $(sysctl -n hw.logicalcpu)
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: icop-macos-x86_64
          path: |
            releases/v*/icop-*.tar.gz
            releases/v*/icop-*.tar.gz.sha256
          if-no-files-found: error

  macos-arm64:
    name: macOS ARM64
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew update
          brew install ninja
      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: |
            _scratch_build
            build-ci/_scratch_build
          key: macos-arm64-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
      - name: Configure
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DICOP_RELEASE_VERSION="${ICOP_VERSION#v}"
          -DNSFW_DOWNLOAD_MODELS=ON
          -DNSFW_BUILD_BENCHMARKS=OFF
          -DNSFW_BUILD_TESTS=OFF
          -DNSFW_INSTALL_VLC_PLUGIN=OFF
      - name: Package
        run: cmake --build build-ci --target icop_package -j $(sysctl -n hw.logicalcpu)
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: icop-macos-arm64
          path: |
            releases/v*/icop-*.tar.gz
            releases/v*/icop-*.tar.gz.sha256
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs:
      - linux-x86_64
      - linux-arm64
      - windows-x86_64
      - macos-x86_64
      - macos-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: icop-*
          path: release-artifacts
          merge-multiple: false
      - name: List artifacts
        run: |
          find release-artifacts -type f | sort
      - name: Generate release notes
        id: release-notes
        run: |
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat .github/release.yml 2>/dev/null >> $GITHUB_OUTPUT || true
          echo "" >> $GITHUB_OUTPUT
          echo "## Downloads" >> $GITHUB_OUTPUT
          find release-artifacts -type f -name "*.tar.gz" -o -name "*.zip" | sort | while read f; do
            name=$(basename "$f")
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            size_mb=$(echo "scale=1; $size / 1048576" | bc)
            echo "- \`$name\` (${size_mb} MB)" >> $GITHUB_OUTPUT
          done
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "icop ${{ github.ref_name }}"
          body: ${{ steps.release-notes.outputs.release_notes }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/icop-*.tar.gz
            release-artifacts/**/icop-*.tar.gz.sha256
            release-artifacts/**/icop-*.zip
            release-artifacts/**/icop-*.zip.sha256
